name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# E2E(Playwright)はここでは走らせない。
# WebGL の描画を SwiftShader(CPU)で行うため実行時間が読めず、
# ジョブのタイムアウトに掛かっていた。ローカルで `npm run test:e2e` を実行する。
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run licenses
      - run: npm test
      - run: npm run build
